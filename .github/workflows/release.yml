name: Release

# Tag v<version> (matching package.json) to publish. The template the release scaffolds from is
# pinned in package.json (templateSource) and must already exist as a ref on the template repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC) needs npm >= 11.5.1; the Node 22 runner ships npm 10.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION"; exit 1
          fi
      - name: Pinned template ref exists
        run: |
          REPOSITORY=$(node -p "require('./package.json').templateSource.repository")
          REF=$(node -p "require('./package.json').templateSource.ref")
          if ! git ls-remote --exit-code "https://github.com/$REPOSITORY.git" "$REF" > /dev/null; then
            echo "templateSource.ref $REF does not exist on $REPOSITORY. Tag the template repository first, then pin that tag in package.json."; exit 1
          fi
          echo "Scaffolds from $REPOSITORY@$REF"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Authenticates via the npm Trusted Publisher configured for this repository and workflow
      # file (no NPM_TOKEN). Provenance is attached automatically.
      - run: npm publish --access public
