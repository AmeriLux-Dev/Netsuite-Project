name: Release

# Tag v<version> (matching package.json) to publish. The template the release scaffolds from is
# named in package.json (templateSource, normally the template repository's main) and must exist as a ref there.
#
# A tag-triggered run uses this file as it exists at the tagged commit. If the workflow itself needs
# fixing, push the fix to main and run this workflow manually with the tag to publish: the manual run
# uses this file from main but builds and publishes the tagged commit, so the tag never moves.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC) needs npm >= 11.5.1; the Node 22 runner ships npm 10.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          TAG="${RELEASE_TAG#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION"; exit 1
          fi
          echo "Publishing $RELEASE_TAG"
      - name: Template ref exists
        run: |
          REPOSITORY=$(node -p "require('./package.json').templateSource.repository")
          REF=$(node -p "require('./package.json').templateSource.ref")
          if ! git ls-remote --exit-code "https://github.com/$REPOSITORY.git" "$REF" > /dev/null; then
            echo "templateSource.ref $REF does not exist on $REPOSITORY. Set templateSource.ref in package.json to a branch or tag that exists there."; exit 1
          fi
          echo "Scaffolds from $REPOSITORY@$REF"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Authenticates via the npm Trusted Publisher configured for this repository and workflow
      # file (no NPM_TOKEN). Provenance is attached automatically.
      - run: npm publish --access public
