name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Published package contains only dist, README and LICENSE
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const allowed = files.every((f) => f.startsWith('dist/') || f === 'package.json' || f === 'README.md' || f === 'LICENSE');
            if (!allowed) { console.error('Unexpected files in package:', files); process.exit(1); }
            console.log('Package files:', files.join(', '));
          "

  scaffold:
    # Scaffolds from the template repository at the ref named in package.json (templateSource):
    # exactly what a release of this CLI downloads.
    name: Scaffold with the template (${{ matrix.os }})
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read the template source
        id: template
        shell: bash
        run: |
          echo "repository=$(node -p "require('./package.json').templateSource.repository")" >> "$GITHUB_OUTPUT"
          echo "ref=$(node -p "require('./package.json').templateSource.ref")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.template.outputs.repository }}
          ref: ${{ steps.template.outputs.ref }}
          path: netsuite-project-templates
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: node netsuite-project-templates/scripts/e2e.mjs --cli .

  release-dry-run:
    # Runs the Release workflow's pre-flight checks and a dry-run publish so a broken release is
    # caught here rather than after tagging. Cannot exercise the npm Trusted Publisher exchange:
    # npm only issues OIDC tokens to release.yml.
    name: Release dry run
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Template ref exists
        run: |
          REPOSITORY=$(node -p "require('./package.json').templateSource.repository")
          REF=$(node -p "require('./package.json').templateSource.ref")
          if ! git ls-remote --exit-code "https://github.com/$REPOSITORY.git" "$REF" > /dev/null; then
            echo "templateSource.ref $REF does not exist on $REPOSITORY. Set templateSource.ref in package.json to a branch or tag that exists there."; exit 1
          fi
          echo "Scaffolds from $REPOSITORY@$REF"
      - run: npm run build
      - run: npm publish --access public --dry-run

  secrets:
    name: Secret and private-reference scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-no-private-refs.mjs
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
